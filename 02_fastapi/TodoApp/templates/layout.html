<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TodoFlow{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/bootstrap.css') }}">

    <!-- Project Styles -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/variables.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/layout.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/components.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/auth.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/dashboard.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/forms.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', path='/css/toast.css') }}">
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/animations.css') }}">


    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/base.css') }}">

    
</head>
<body>
    <div id="toast-container"
     class="toast-container">
    </div>
    {% include 'navbar.html' %}

    <main class="app-container">

        {% block content %}

        {% endblock %}

    </main>
    <script src="{{ url_for('static', path='/js/jquery-slim.js')}}"></script>
    <script src="{{ url_for('static', path='/js/popper.js')}}"></script>
    <script src="{{ url_for('static', path='/js/bootstrap.js')}}"></script>
    <script src="{{ url_for('static', path='/js/base.js')}}" defer></script>
</body>
</html>
